        - paragraph [ref=e90]: "Friday shift, one rest period 04:15–16:15:"
        - paragraph [ref=e91]:
          - text: Worked time is 00:00–04:15 and 16:15–24:00. The early-morning slice belongs to Thursday evening →
          - generic [ref=e92]: OB1
