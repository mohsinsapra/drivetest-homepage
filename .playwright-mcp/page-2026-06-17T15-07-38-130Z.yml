      - paragraph [ref=e56]: The figures above are the calculator's default example rates. Your actual OB rates depend on your collective agreement and the year — you can change them in the calculator.
      - generic [ref=e57]:
        - figure [ref=e58]:
          - img "Day and night, representing OB1 and OB2" [ref=e59]
        - generic [ref=e70]:
          - heading "Day, night and the \"evening date\" rule" [level=2] [ref=e71]
          - paragraph [ref=e72]:
            - text: A night belongs to its
            - strong [ref=e73]: evening date
            - text: ": the slice from 00:00–06:00 is owned by the previous evening. So a shift that starts late on Friday and runs past midnight into Saturday morning still counts as a"
            - strong [ref=e74]: Friday night
            - text: — and stays OB2. This is the rule that trips most people up when they try to add hours by hand.
      - heading "How taxi OB is calculated, step by step" [level=2] [ref=e75]
      - list [ref=e76]:
        - listitem [ref=e77]:
          - strong [ref=e78]: Read the Vilotidsrapport.
          - text: Note each day's date and its rest periods (from–to times).
        - listitem [ref=e79]:
          - strong [ref=e80]: Find the worked time.
          - text: Worked time = the gaps
          - emphasis [ref=e81]: between
          - text: rest periods within the day's window.
        - listitem [ref=e82]:
          - strong [ref=e83]: Split each worked slice
          - text: at 06:00 and 19:00 (and midnight), so no slice spans two bands.
        - listitem [ref=e84]:
          - strong [ref=e85]: Classify each slice
          - text: as Normal, OB1 or OB2 by the time of day and the weekday (using the evening-date rule for nights).
        - listitem [ref=e86]:
          - strong [ref=e87]: Multiply
          - text: the OB1 and OB2 minutes by their rates and add them up — that's your OB pay.
      - generic [ref=e88]:
