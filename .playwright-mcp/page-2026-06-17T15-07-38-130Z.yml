        - heading "⚠ Why Migrationsverket may look at your OB" [level=3] [ref=e112]
        - paragraph [ref=e113]:
          - text: When you apply to
          - strong [ref=e114]: extend your permit
          - text: or for
          - strong [ref=e115]: permanent residence (PR)
          - text: ", Migrationsverket checks that your real working conditions matched the terms your permit was granted on — the agreed salary, the hours, and that your total pay reaches the collective-agreement level"
          - emphasis [ref=e116]: including OB supplements
          - text: .
        - paragraph [ref=e117]: "Practical points:"
        - list [ref=e118]:
          - listitem [ref=e119]:
            - text: Your reported OB and hours should match your
            - strong [ref=e120]: Vilotidsrapport and payslips
            - text: . Under-reported OB or mismatched hours can raise questions during an extension or PR review.
          - listitem [ref=e121]:
            - text: Keep your
            - strong [ref=e122]: own copies
            - text: of rest-time slips and payslips — you may be asked to show your monthly pay met the required level.
          - listitem [ref=e123]:
            - text: If an employer under-pays or mis-reports OB, it can affect
            - emphasis [ref=e124]: your
            - text: permit case, not only theirs.
        - paragraph [ref=e125]: Getting OB right protects both your income and your residence-permit case. Use the calculator to check every slip and keep a clean record.
