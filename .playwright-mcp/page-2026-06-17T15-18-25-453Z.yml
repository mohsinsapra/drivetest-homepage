      - paragraph [ref=e51]: The figures above are the calculator's default example rates. Your actual OB rates depend on your collective agreement and the year — you can change them in the calculator.
      - generic [ref=e52]:
        - figure [ref=e53]:
          - img "Lit taxi sign at night — night hours carry the higher OB2 supplement" [ref=e54]
        - generic [ref=e55]:
          - heading "Day, night and the \"evening date\" rule" [level=2] [ref=e56]
          - paragraph [ref=e57]:
            - text: A night belongs to its
            - strong [ref=e58]: evening date
            - text: ": the slice from 00:00–06:00 is owned by the previous evening. So a shift that starts late on Friday and runs past midnight into Saturday morning still counts as a"
            - strong [ref=e59]: Friday night
            - text: — and stays OB2. This is the rule that trips most people up when they try to add hours by hand.
      - heading "How taxi OB is calculated, step by step" [level=2] [ref=e60]
      - list [ref=e61]:
        - listitem [ref=e62]:
          - strong [ref=e63]: Read the Vilotidsrapport.
          - text: Note each day's date and its rest periods (from–to times).
        - listitem [ref=e64]:
          - strong [ref=e65]: Find the worked time.
          - text: Worked time = the gaps
          - emphasis [ref=e66]: between
          - text: rest periods within the day's window.
        - listitem [ref=e67]:
          - strong [ref=e68]: Split each worked slice
          - text: at 06:00 and 19:00 (and midnight), so no slice spans two bands.
        - listitem [ref=e69]:
          - strong [ref=e70]: Classify each slice
          - text: as Normal, OB1 or OB2 by the time of day and the weekday (using the evening-date rule for nights).
        - listitem [ref=e71]:
          - strong [ref=e72]: Multiply
          - text: the OB1 and OB2 minutes by their rates and add them up — that's your OB pay.
      - generic [ref=e73]:
        - heading "Worked example" [level=3] [ref=e74]
        - paragraph [ref=e75]: "Friday shift, one rest period 04:15–16:15:"
        - paragraph [ref=e76]:
          - text: Worked time is 00:00–04:15 and 16:15–24:00. The early-morning slice belongs to Thursday evening →
          - generic [ref=e77]: OB1
          - text: 4 h 15 m. 16:15–19:00 is Friday daytime →
          - generic [ref=e78]: Normal
          - text: 2 h 45 m. 19:00–24:00 is Friday evening →
          - generic [ref=e79]: OB2
          - text: 5 h. At the example rates that's 4.25 × 31.58 + 5 × 52.79 =
          - strong [ref=e80]: 796.33 kr
          - text: of OB on top of base pay.
