    - article [ref=e13]:
      - paragraph [ref=e14]:
        - strong [ref=e15]: OB
        - text: is one of the most important — and most misunderstood — parts of a taxi driver's pay in Sweden. If you drive evenings, nights, weekends or holidays, a big share of your wage comes from OB supplements. This guide explains what OB means, how OB1 and OB2 differ, and how the amount is worked out from your rest-time slip, so you can check that every krona you've earned actually shows up on your payslip.
      - generic [ref=e16]:
        - figure [ref=e17]:
          - img "Taxi driver's hands on the wheel — the worked hours that OB is paid for" [ref=e18]
        - generic [ref=e19]:
          - heading "What is OB?" [level=2] [ref=e20]
          - paragraph [ref=e21]:
            - text: OB stands for
            - strong [ref=e22]: obekväm arbetstid
            - text: — "inconvenient working hours." It's a wage supplement paid
            - emphasis [ref=e23]: on top of
            - text: "your normal hourly rate when you work at times most people don't: evenings, nights, weekends and public holidays. The rates and exact hours come from the collective agreement (Taxiavtalet)."
          - paragraph [ref=e24]:
            - text: For taxi drivers, OB is tied to the
            - strong [ref=e25]: Vilotidsrapport
            - text: — the rest-time slip that records when you rested during a shift. Your
            - emphasis [ref=e26]: worked
            - text: time is simply the gaps between those rest periods, and each gap is priced by when it happened.
      - heading "OB1 vs OB2 — the two bands" [level=2] [ref=e27]
      - paragraph [ref=e28]: There are two OB levels. OB2 is the higher one, paid for the most antisocial hours; OB1 is the lower one. Everything else is Normal time with no supplement.
