        - heading "⚠ Why Migrationsverket may look at your OB" [level=3] [ref=e90]
        - paragraph [ref=e91]:
          - text: When you apply to
          - strong [ref=e92]: extend your permit
          - text: or for
          - strong [ref=e93]: permanent residence (PR)
          - text: ", Migrationsverket checks that your real working conditions matched the terms your permit was granted on — the agreed salary, the hours, and that your total pay reaches the collective-agreement level"
          - emphasis [ref=e94]: including OB supplements
          - text: .
        - paragraph [ref=e95]: "Practical points:"
        - list [ref=e96]:
          - listitem [ref=e97]:
            - text: Your reported OB and hours should match your
            - strong [ref=e98]: Vilotidsrapport and payslips
            - text: . Under-reported OB or mismatched hours can raise questions during an extension or PR review.
          - listitem [ref=e99]:
            - text: Keep your
            - strong [ref=e100]: own copies
            - text: of rest-time slips and payslips — you may be asked to show your monthly pay met the required level.
          - listitem [ref=e101]:
            - text: If an employer under-pays or mis-reports OB, it can affect
            - emphasis [ref=e102]: your
            - text: permit case, not only theirs.
        - paragraph [ref=e103]: Getting OB right protects both your income and your residence-permit case. Use the calculator to check every slip and keep a clean record.
