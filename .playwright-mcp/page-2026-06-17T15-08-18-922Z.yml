            - cell "Mån–fre dagtid 06:00 → 19:00 (ej röd dag)" [ref=e54]
            - cell "—" [ref=e55]
      - paragraph [ref=e56]: Siffrorna ovan är kalkylatorns exempelsatser. Dina verkliga OB-satser beror på ditt kollektivavtal och året — du kan ändra dem i kalkylatorn.
      - generic [ref=e57]:
        - figure [ref=e58]:
          - img "Dag och natt, OB1 och OB2" [ref=e59]
        - generic [ref=e70]:
          - heading "Dag, natt och regeln om \"kvällsdatum\"" [level=2] [ref=e71]
          - paragraph [ref=e72]:
            - text: En natt tillhör sitt
            - strong [ref=e73]: kvällsdatum
            - text: ": delen 00:00–06:00 ägs av kvällen före. Ett pass som börjar sent på fredagen och fortsätter förbi midnatt in på lördag morgon räknas alltså fortfarande som en"
            - strong [ref=e74]: fredagsnatt
            - text: — och förblir OB2. Det är den här regeln som ställer till det mest när man försöker räkna timmar för hand.
      - heading "Så räknas taxi-OB ut, steg för steg" [level=2] [ref=e75]
      - list [ref=e76]:
        - listitem [ref=e77]:
          - strong [ref=e78]: Läs vilotidsrapporten.
          - text: Notera varje dags datum och dess viloperioder (från–till-tider).
        - listitem [ref=e79]:
          - strong [ref=e80]: Hitta arbetad tid.
          - text: Arbetad tid = mellanrummen
          - emphasis [ref=e81]: mellan
          - text: viloperioderna inom dagens fönster.
        - listitem [ref=e82]:
          - strong [ref=e83]: Dela varje arbetad del
          - text: vid 06:00 och 19:00 (och midnatt), så att ingen del spänner över två nivåer.
        - listitem [ref=e84]:
          - strong [ref=e85]: Klassa varje del
          - text: som Normal, OB1 eller OB2 efter tid på dygnet och veckodag (med kvällsdatum-regeln för nätter).
        - listitem [ref=e86]:
          - strong [ref=e87]: Multiplicera
          - text: OB1- och OB2-minuterna med satserna och summera — det är din OB-ersättning.
      - generic [ref=e88]:
        - heading "Räkneexempel" [level=3] [ref=e89]
        - paragraph [ref=e90]: "Fredagspass, en viloperiod 04:15–16:15:"
        - paragraph [ref=e91]:
          - text: Arbetad tid är 00:00–04:15 och 16:15–24:00. Den tidiga morgondelen tillhör torsdagskvällen →
          - generic [ref=e92]: OB1
          - text: 4 tim 15 min. 16:15–19:00 är fredag dagtid →
          - generic [ref=e93]: Normal
          - text: 2 tim 45 min. 19:00–24:00 är fredagskväll →
          - generic [ref=e94]: OB2
          - text: 5 tim. Med exempelsatserna blir det 4,25 × 31,58 + 5 × 52,79 =
          - strong [ref=e95]: 796,33 kr
          - text: i OB utöver grundlönen.
      - generic [ref=e96]:
        - figure [ref=e97]:
          - img "Ett uppehållstillståndskort med en kontrollsköld" [ref=e98]
        - generic [ref=e106]:
          - heading "OB och ditt arbets-/uppehållstillstånd" [level=2] [ref=e107]
          - paragraph [ref=e108]:
            - text: Arbetar du i Sverige på
            - strong [ref=e109]: arbetstillstånd
            - text: är OB mer än lön — det är en del av din anställningshistorik, och det kan vara ett
            - strong [ref=e110]: känsligt område
            - text: .
      - generic [ref=e111]:
        - heading "⚠ Varför Migrationsverket kan granska din OB" [level=3] [ref=e112]
        - paragraph [ref=e113]:
          - text: När du ansöker om att
          - strong [ref=e114]: förlänga ditt tillstånd
          - text: eller om
          - strong [ref=e115]: permanent uppehållstillstånd (PUT)
          - text: kontrollerar Migrationsverket att dina verkliga arbetsvillkor motsvarade det tillståndet beviljades på — avtalad lön, arbetstid och att din totala lön når kollektivavtalsnivå
          - emphasis [ref=e116]: inklusive OB-tillägg
          - text: .
        - paragraph [ref=e117]: "Praktiska punkter:"
        - list [ref=e118]:
          - listitem [ref=e119]:
            - text: Din rapporterade OB och arbetstid ska stämma med
            - strong [ref=e120]: vilotidsrapport och lönespecar
            - text: . För lågt rapporterad OB eller tider som inte stämmer kan väcka frågor vid en förlängning eller PUT-prövning.
          - listitem [ref=e121]:
            - text: Spara
            - strong [ref=e122]: egna kopior
            - text: av vilotidsrapporter och lönespecar — du kan behöva visa att månadslönen nådde rätt nivå.
          - listitem [ref=e123]:
            - text: Om en arbetsgivare betalar för lite eller rapporterar fel OB kan det drabba
            - emphasis [ref=e124]: ditt
            - text: tillståndsärende, inte bara arbetsgivarens.
        - paragraph [ref=e125]: Att få OB rätt skyddar både din inkomst och ditt uppehållstillståndsärende. Använd kalkylatorn för att kontrollera varje rapport och hålla ordning.
