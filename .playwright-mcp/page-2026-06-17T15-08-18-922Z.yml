  - generic [ref=e8]:
    - banner [ref=e9]:
      - generic [ref=e10]: Sverige · Taxilön
      - heading "Taxi OB-kalkylator Sverige" [level=1] [ref=e11]
      - paragraph [ref=e12]: Vad OB innebär för taxiförare i Sverige — och exakt hur OB1 och OB2 räknas ut från din vilotidsrapport. Räkna sedan ut din OB-ersättning på några sekunder med vår gratis kalkylator.
    - article [ref=e13]:
      - paragraph [ref=e14]:
        - strong [ref=e15]: OB
        - text: är en av de viktigaste — och mest missförstådda — delarna av en taxiförares lön i Sverige. Kör du kvällar, nätter, helger eller röda dagar kommer en stor del av lönen från OB-tillägg. Den här guiden förklarar vad OB betyder, hur OB1 och OB2 skiljer sig åt och hur beloppet räknas ut från din vilotidsrapport — så att du kan kontrollera att varje krona du tjänat faktiskt syns på lönespecen.
      - generic [ref=e16]:
        - figure [ref=e17]:
          - img "En vilotidsrapport med en klocka" [ref=e18]
        - generic [ref=e24]:
          - heading "Vad är OB?" [level=2] [ref=e25]
          - paragraph [ref=e26]:
            - text: OB står för
            - strong [ref=e27]: obekväm arbetstid
            - text: . Det är ett lönetillägg
            - emphasis [ref=e28]: utöver
            - text: "din vanliga timlön när du arbetar på tider då de flesta inte gör det: kvällar, nätter, helger och röda dagar. Satserna och de exakta tiderna kommer från kollektivavtalet (Taxiavtalet)."
          - paragraph [ref=e29]:
            - text: För taxiförare är OB kopplat till
            - strong [ref=e30]: vilotidsrapporten
            - text: — som visar när du vilade under ett pass. Din
            - emphasis [ref=e31]: arbetade
            - text: tid är helt enkelt mellanrummen mellan viloperioderna, och varje mellanrum prissätts efter när det inträffade.
      - heading "OB1 mot OB2 — de två nivåerna" [level=2] [ref=e32]
      - paragraph [ref=e33]: Det finns två OB-nivåer. OB2 är den högre, för de mest obekväma timmarna; OB1 är den lägre. Allt annat är Normal tid utan tillägg.
      - table [ref=e34]:
        - rowgroup [ref=e35]:
          - row "Nivå När det gäller Exempelsats" [ref=e36]:
