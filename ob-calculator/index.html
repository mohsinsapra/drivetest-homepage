<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OB Calculator · Drive Test</title>
<link rel="icon" href="../assets/favicon.png">
<script>try{var t=localStorage.getItem('dt_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:"Syne",sans-serif;
    --font-body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --bg:#f7f7fd; --bg-2:#efeefb; --card:#ffffff; --text:#14132b; --muted:#5d5b80;
    --accent:#5a51fe; --accent-2:#8751fe; --yellow:#c98a00; --yellow-bright:#ffc400;
    --border:rgba(20,19,43,.09); --shadow:0 18px 60px rgba(38,30,120,.13);
    --field:#f1f0fb; --field-bd:rgba(20,19,43,.1);
    --ob1:#5a51fe; --ob1-soft:rgba(90,81,254,.12);
    --ob2:#c98a00; --ob2-soft:rgba(232,168,0,.16);
    --ok:#0c9b67; --bad:#e0577a; --r:22px;
  }
  [data-theme="dark"]{
    --bg:#0b0a15; --bg-2:#110f20; --card:#14121f; --text:#eceaf8; --muted:#9b98c2;
    --accent:#7b72ff; --accent-2:#a887ff; --yellow:#ffd60a; --yellow-bright:#ffd60a;
    --border:rgba(236,234,248,.09); --shadow:0 18px 60px rgba(0,0,0,.55);
    --field:rgba(255,255,255,.045); --field-bd:rgba(236,234,248,.12);
    --ob1:#9d96ff; --ob1-soft:rgba(123,114,255,.18);
    --ob2:#ffd60a; --ob2-soft:rgba(255,214,10,.14);
    --ok:#3ddc97; --bad:#ff9fb0;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  .wrap{max-width:920px;margin:0 auto;padding:40px 18px 120px}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .field{position:relative}

  .topbar{position:fixed;top:16px;right:20px;z-index:1000;display:flex;gap:8px}
  .topbar__btn{background:var(--card);color:var(--muted);border:1.5px solid var(--border);border-radius:20px;
    padding:7px 13px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
  .topbar__btn:hover{border-color:var(--accent);color:var(--text)}

  header{display:flex;align-items:center;gap:14px;margin-bottom:8px;animation:fadeUp .6s both}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;box-shadow:0 10px 28px -8px var(--accent);font-size:23px}
  h1{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
  .tag{color:var(--muted);font-size:15px;margin:4px 0 28px;animation:fadeUp .6s .05s both}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:18px;
    box-shadow:var(--shadow);animation:fadeUp .6s both}
  .step{display:flex;align-items:center;gap:10px;margin-bottom:15px;font-weight:700;font-size:12px;color:var(--yellow);
    text-transform:uppercase;letter-spacing:.18em}
  .num{width:24px;height:24px;border-radius:8px;background:var(--ob1-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800}

  label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600}
  input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--field-bd);
    border-radius:12px;padding:11px 13px;transition:.2s;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ob1-soft)}
  select{appearance:none;cursor:pointer}
  textarea{min-height:170px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;white-space:pre;resize:vertical}
  .row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:170px}

  button{font-family:var(--font-body);font-weight:700;font-size:15px;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;
    color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));transition:.25s}
  button:hover{transform:translateY(-1px);box-shadow:0 12px 30px -10px var(--accent)}
  button:active{transform:translateY(0) scale(.985)}
  button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
  button.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
  button.ghost:hover{border-color:var(--accent);box-shadow:none}
  .btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}

  .drop{border:1.5px dashed var(--field-bd);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted);
    cursor:pointer;transition:.25s;background:var(--field)}
  .drop:hover{border-color:var(--accent);color:var(--text)}
  .drop.over{border-color:var(--accent);background:var(--ob1-soft);transform:scale(1.01)}
  .drop .ic{font-size:30px;display:block;margin-bottom:8px;transition:.25s}
  .drop:hover .ic{transform:translateY(-3px)}
  .drop img{max-width:100%;max-height:360px;border-radius:13px;box-shadow:var(--shadow);animation:pop .4s both}

  .spin{width:17px;height:17px;border:2.5px solid var(--ob1-soft);border-top-color:var(--accent);border-radius:50%;
    display:inline-block;animation:rot .7s linear infinite;vertical-align:-3px}
  .hint{color:var(--muted);font-size:13px}
  .err{color:var(--bad);font-size:13.5px;white-space:pre-wrap;margin-top:10px}
  .warn{color:var(--yellow);font-size:13px;margin-top:10px}

  .obwrap{display:grid;grid-template-columns:1fr;gap:18px}
  .obcard{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow);animation:fadeUp .5s both}
  .obhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .obhead .l{display:flex;align-items:center;gap:11px}
  .pill{font-size:12px;font-weight:800;padding:4px 11px;border-radius:99px;letter-spacing:.04em}
  .pill.o1{background:var(--ob1-soft);color:var(--accent)}
  .pill.o2{background:var(--ob2-soft);color:var(--ob2)}
  .pill.o0{background:var(--field);color:var(--muted);border:1px solid var(--border)}
  .pill.sm{font-size:11px;padding:2px 8px;font-weight:700;margin-right:5px}
  .rate{color:var(--muted);font-size:13px}
  .obamt{font-family:var(--font-display);font-weight:800;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:11px 20px;background:var(--field)}
  tbody td{padding:9px 20px;border-top:1px solid var(--border)}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:var(--field)}
  td.t{text-align:right}
  tr.rowin{animation:rowin .4s both}
  .bar{height:4px;background:var(--field);border-radius:9px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;border-radius:9px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .o1 .bar i{background:var(--accent)} .o2 .bar i{background:var(--ob2)}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);animation:fadeUp .5s both}
  .scard .k{color:var(--muted);font-size:12px;font-weight:600}
  .scard .v{font-family:var(--font-display);font-size:23px;font-weight:800;margin-top:6px}
  .scard .s{color:var(--muted);font-size:12.5px;margin-top:2px}
  .scard.total{background:linear-gradient(135deg,var(--ob1-soft),var(--ob2-soft));border-color:var(--accent)}
  .scard.total .v{color:var(--accent)}
  @media(max-width:620px){.summary{grid-template-columns:repeat(2,1fr)}}

  .tlcard{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-top:18px;animation:fadeUp .5s both}
  .tlcard .obhead{flex-wrap:wrap;gap:8px}
  .tlscroll{overflow-x:auto}
  table.tl{min-width:560px}
  table.tl input.tin{font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:6px 8px;border-radius:9px;
    background:var(--field);border:1px solid var(--field-bd);width:186px}
  table.tl input.tin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ob1-soft)}
  table.tl td{vertical-align:middle}
  table.tl tr.bad input.tin{border-color:var(--bad)}
  .xbtn{background:var(--field);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:6px 10px;
    cursor:pointer;transition:.18s;font-family:var(--font-body);font-weight:600;font-size:12px}
  .xbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tlfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px}
  .tlfoot .tots span{margin-right:16px;font-size:13.5px;color:var(--muted)}
  .tlfoot .tots b{color:var(--text);font-weight:800}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes rowin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @keyframes rot{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar"><button type="button" id="theme-toggle" class="topbar__btn" aria-label="Toggle theme"><span class="theme-icon">🌙</span></button></div>
<div class="wrap">
  <header><div class="logo">🚕</div><div style="flex:1"><h1>OB Calculator</h1></div>
    <a href="../" style="color:var(--mut);text-decoration:none;font-size:13px;border:1px solid var(--stroke);padding:8px 13px;border-radius:10px;transition:.2s" onmouseover="this.style.color='#eef2f8'" onmouseout="this.style.color='var(--mut)'">← DriveTest</a></header>
  <p class="tag">Snap a Vilotidsrapport → AI reads it → you verify → OB1 / OB2 priced instantly.</p>

  <!-- 1. connect -->
  <div class="card">
    <div class="step"><span class="num">1</span> Connect</div>
    <div class="row">
      <div class="field"><label>Groq API key <span class="hint">· stored only in this browser</span></label>
        <input id="key" type="password" placeholder="gsk_…" autocomplete="off"></div>
      <div class="field" style="flex:0 0 260px"><label>Model <span id="mstatus" class="hint"></span></label>
        <select id="model"><option>add key to load models…</option></select></div>
    </div>
    <details style="margin-top:12px">
      <summary class="hint" style="cursor:pointer">Advanced · API base URL (Worker proxy if CORS-blocked)</summary>
      <input id="base" style="margin-top:8px" value="https://api.groq.com">
    </details>
  </div>

  <!-- 2. upload -->
  <div class="card">
    <div class="step"><span class="num">2</span> Upload slip</div>
    <div id="drop" class="drop"><span class="ic">📷</span>Click or drop a Vilotidsrapport photo</div>
    <input id="file" type="file" accept="image/*" hidden>
    <div class="btnrow"><button id="parse" disabled>Read photo</button>
      <button class="ghost" id="manual">✎ Enter JSON manually</button>
      <span id="status" class="hint"></span></div>
    <div id="err" class="err"></div>
  </div>

  <!-- 3. verify -->
  <div class="card" id="editCard" style="display:none">
    <div class="step"><span class="num">3</span> Verify &amp; fix</div>
    <label>Parsed data — correct any misread digit, drop unwanted days, tweak window / holidays</label>
    <textarea id="cfg" spellcheck="false"></textarea>
    <div id="notes" class="warn"></div>
    <div class="btnrow"><button id="calc">Calculate OB</button><button class="ghost" id="copy">Copy JSON</button></div>
  </div>

  <!-- 4. results -->
  <div id="out" style="display:none">
    <div class="step" style="margin:6px 2px 14px"><span class="num">4</span> Result</div>
    <div class="obwrap" id="obwrap"></div>
    <div class="summary" id="summary"></div>
    <div class="tlcard" id="tlcard"></div>
  </div>
</div>

<script src="calc.js"></script>
<script>
const HOLIDAYS=["2026-01-01","2026-01-06","2026-04-03","2026-04-05","2026-04-06","2026-05-01",
  "2026-05-14","2026-05-24","2026-06-06","2026-06-20","2026-10-31","2026-12-25","2026-12-26"];

const PROMPT=`You read a Swedish taxi "Vilotidsrapport" (rest-time slip) from a photo and output JSON only.
Each "Vilotid" block has a Datum (date) and up to two ranges "Från och med klockan – Till och med klockan". These are REST periods.
Rules:
- A block with a BLANK Datum continues the date of the block above (a day can have several rest periods).
- "24:00" = midnight (end of day); keep it as "24:00".
- A rest may cross midnight (written "23:37 –" on one block, "– 00:30" on the next); combine into one range on the earlier date when clear.
- Read handwriting carefully; common confusions: 00 vs 02, 1 vs 7, 3 vs 5, 8 vs 6, 9 vs 4.
Output EXACTLY:
{ "entries":[ {"date":"YYYY-MM-DD","rests":[["HH:MM","HH:MM"]]} ], "uncertain":["notes on unclear digits"] }
Two-digit year 26 = 2026. JSON only, no prose.`;

const SEK=new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK'});
const $=s=>document.querySelector(s);
let dataUrl=null;

$('#key').value=localStorage.getItem('groqKey')||'';
$('#base').value=localStorage.getItem('groqBase')||$('#base').value;
$('#key').oninput=e=>{localStorage.setItem('groqKey',e.target.value);debouncedModels()};
$('#base').oninput=e=>localStorage.setItem('groqBase',e.target.value);

const api=p=>$('#base').value.replace(/\/$/,'')+'/openai/v1'+p;
let mt; const debouncedModels=()=>{clearTimeout(mt);mt=setTimeout(loadModels,500)};
if($('#key').value.length>20) loadModels();

const VIS=id=>/(llama-4|maverick|scout|vision|llava|pixtral|qwen.*(vl|vision)|gemma.*vision)/i.test(id);
async function loadModels(){
  const key=$('#key').value.trim(); if(key.length<20)return;
  $('#mstatus').innerHTML='<span class="spin"></span>';
  try{
    const r=await fetch(api('/models'),{headers:{Authorization:'Bearer '+key}});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,120));
    let ids=(await r.json()).data.map(m=>m.id);
    ids.sort((a,b)=>(VIS(b)-VIS(a))||a.localeCompare(b));
    const saved=localStorage.getItem('groqModel');
    $('#model').innerHTML=ids.map(id=>`<option ${id===saved?'selected':''}>${id}${VIS(id)?' · 👁 vision':''}</option>`).join('');
    if(!saved){const f=ids.find(VIS)||ids[0]; if(f)$('#model').value=f;}
    $('#mstatus').textContent=`· ${ids.length} models`;
  }catch(e){$('#mstatus').textContent='· could not load ('+e.message+')';}
}
$('#model').onchange=e=>localStorage.setItem('groqModel',e.target.value.split(' · ')[0]);

// upload
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])};
$('#file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
function loadFile(f){const r=new FileReader();r.onload=()=>{dataUrl=r.result;drop.innerHTML=`<img src="${dataUrl}">`;$('#parse').disabled=false};r.readAsDataURL(f)}

function nextDay(s){const d=new Date(s);d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function holsFor(es){if(!es.length)return[];const d=es.map(e=>e.date).sort();return HOLIDAYS.filter(h=>h>=d[0]&&h<=d[d.length-1])}

$('#parse').onclick=async()=>{
  $('#err').textContent='';$('#status').innerHTML='<span class="spin"></span> reading…';$('#parse').disabled=true;
  try{
    const model=$('#model').value.split(' · ')[0];
    const body={model,temperature:0,response_format:{type:'json_object'},
      messages:[{role:'user',content:[{type:'text',text:PROMPT},{type:'image_url',image_url:{url:dataUrl}}]}]};
    const res=await fetch(api('/chat/completions'),{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('#key').value},body:JSON.stringify(body)});
    if(!res.ok)throw new Error('API '+res.status+': '+(await res.text()).slice(0,400));
    const p=JSON.parse((await res.json()).choices[0].message.content);
    const es=p.entries||[];
    const cfg={entries:es,holidays:holsFor(es),
      window_start:es.length?es[0].date+' 00:00':'',window_end:es.length?nextDay(es[es.length-1].date)+' 00:00':'',
      rates:{ob1:31.58,ob2:52.79}};
    $('#cfg').value=JSON.stringify(cfg,null,2);
    $('#notes').textContent=(p.uncertain&&p.uncertain.length)?'⚠ Double-check: '+p.uncertain.join(' · '):'';
    $('#editCard').style.display='';$('#status').textContent='✓ read — verify below';
    $('#editCard').scrollIntoView({behavior:'smooth'});
  }catch(e){$('#err').textContent=e.message;$('#status').textContent='';}
  finally{$('#parse').disabled=false;}
};
$('#copy').onclick=()=>navigator.clipboard.writeText($('#cfg').value);

// enter JSON without a photo
const TEMPLATE=JSON.stringify({
  entries:[{date:"2026-05-01",rests:[["04:15","16:15"]]},
           {date:"2026-05-02",rests:[["02:40","15:13"],["17:43","19:43"]]}],
  window_start:"2026-05-01 00:00", window_end:"2026-05-03 00:00",
  holidays:["2026-05-01"], rates:{ob1:31.58,ob2:52.79}
},null,2);
$('#manual').onclick=()=>{
  if(!$('#cfg').value.trim()) $('#cfg').value=TEMPLATE;
  $('#editCard').style.display='';
  $('#cfg').scrollIntoView({behavior:'smooth'});
  $('#cfg').focus();
};

let TL={list:[],holidays:new Set(),rates:{ob1:31.58,ob2:52.79}};

$('#calc').onclick=()=>{
  $('#err').textContent='';
  try{
    const cfg=JSON.parse($('#cfg').value);
    const {intervals,rates,holidays}=compute(cfg);
    TL.list=intervals.map(([a,b])=>[new Date(a),new Date(b)]);
    TL.holidays=holidays; TL.rates=rates;
    $('#out').style.display='';
    renderAll(true);
    $('#out').scrollIntoView({behavior:'smooth'});
  }catch(e){$('#err').textContent='Calc error: '+e.message;}
};

const dl=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toTimeString().slice(0,5);
const pad=n=>String(n).padStart(2,'0');
const toLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const isoLocal=d=>toLocal(d).replace('T',' ');
const bandCls=b=>b==='OB1'?'o1':b==='OB2'?'o2':'o0';

// write the current timeline back into the JSON box as a lossless work-interval config
function syncJson(){
  $('#cfg').value=JSON.stringify({
    work: TL.list.map(([a,b])=>[isoLocal(a),isoLocal(b)]),
    holidays:[...TL.holidays], rates:TL.rates
  },null,2);
}
function exportCSV(){
  const rows=[['From','To','OB1','OB2','Normal','Hours']];
  TL.list.forEach(([a,b])=>{const t=splitInterval(a,b,TL.holidays);const dur=Math.max(0,Math.round((b-a)/60000));
    rows.push([isoLocal(a),isoLocal(b),fmt(t.OB1),fmt(t.OB2),fmt(t.NORMAL),fmt(dur)]);});
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='ob-timeline.csv'; a.click();
}

function obCard(merged,band,rate,grandMax){
  const rs=merged.filter(r=>r[2]===band);let mins=0;
  const rows=rs.map(([a,b,_,m],i)=>{mins+=m;return `<tr class="rowin" style="animation-delay:${.03*i}s">
    <td>${dl(a)} → ${dl(b)}</td><td class="t mono">${fmt(m)}</td></tr>`}).join('');
  const amt=mins/60*rate, cls=bandCls(band);
  return {html:`<div class="obcard ${cls}">
    <div class="obhead"><div class="l"><span class="pill ${cls}">${band}</span><span class="rate">${rate} SEK/h · ${fmt(mins)} h</span></div>
      <span class="obamt mono">${SEK.format(amt)}</span></div>
    <table><thead><tr><th>From → To</th><th class="t">Worked</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="padding:0 18px 16px"><div class="bar"><i data-w="${grandMax?Math.round(mins/grandMax*100):0}"></i></div></div>
  </div>`, mins, amt};
}
function countUp(el,to,fmtFn){const t0=performance.now(),d=650;
  (function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmtFn(to*e);if(k<1)requestAnimationFrame(f)})(performance.now())}

function renderAll(animate){
  TL.list.sort((x,y)=>x[0]-y[0]);
  const rates=TL.rates;
  const per=TL.list.map(([a,b])=>splitInterval(a,b,TL.holidays));
  const totals={OB1:0,OB2:0,NORMAL:0};
  per.forEach(t=>{totals.OB1+=t.OB1;totals.OB2+=t.OB2;totals.NORMAL+=t.NORMAL});
  const {rows}=classifyIntervals(TL.list,TL.holidays);
  const merged=mergeSameBand(rows);

  // band cards
  const gm=Math.max(totals.OB1,totals.OB2,1);
  const c1=obCard(merged,'OB1',rates.ob1,gm), c2=obCard(merged,'OB2',rates.ob2,gm);
  const total=c1.amt+c2.amt;
  $('#obwrap').innerHTML=c1.html+c2.html;

  // summary
  $('#summary').innerHTML=`
    <div class="scard"><div class="k">OB1 hours</div><div class="v mono" id="v1">${fmt(totals.OB1)}</div><div class="s">${SEK.format(c1.amt)}</div></div>
    <div class="scard"><div class="k">OB2 hours</div><div class="v mono" id="v2">${fmt(totals.OB2)}</div><div class="s">${SEK.format(c2.amt)}</div></div>
    <div class="scard"><div class="k">Normal (no OB)</div><div class="v mono">${fmt(totals.NORMAL)}</div><div class="s">unpaid premium</div></div>
    <div class="scard total"><div class="k">Total OB pay</div><div class="v mono" id="vt">${SEK.format(total)}</div><div class="s">OB1 + OB2</div></div>`;

  // editable timeline (one row per work period, sorted, mixed bands allowed)
  const body=TL.list.map(([a,b],i)=>{
    const t=per[i], dur=Math.round((b-a)/60000), bad=!(dur>0);
    const badges=['OB2','OB1','NORMAL'].filter(k=>t[k]>0)
      .map(k=>`<span class="pill sm ${bandCls(k)}">${k==='NORMAL'?'Norm':k} ${fmt(t[k])}</span>`).join('')||'<span class="hint">—</span>';
    return `<tr class="${bad?'bad':''}">
      <td><input class="tin" type="datetime-local" step="60" data-i="${i}" data-k="0" value="${toLocal(a)}"></td>
      <td><input class="tin" type="datetime-local" step="60" data-i="${i}" data-k="1" value="${toLocal(b)}"></td>
      <td>${badges}</td>
      <td class="t mono">${bad?'<span style="color:#ff9fb0">0:00</span>':fmt(dur)}</td>
      <td><button class="xbtn" data-del="${i}">✕</button></td></tr>`;
  }).join('');
  $('#tlcard').innerHTML=`
    <div class="obhead"><div class="l"><b>Work timeline</b> <span class="rate">· editable · ${TL.list.length} periods</span></div>
      <div style="display:flex;gap:8px">
        <button class="xbtn" id="csvbtn" style="padding:7px 12px">⤓ CSV</button>
        <button class="xbtn" id="addrow" style="padding:7px 12px">＋ Add period</button></div></div>
    <div class="tlscroll"><table class="tl"><thead><tr>
      <th>From</th><th>To</th><th>Breakdown</th><th class="t">Hours</th><th></th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="tlfoot"><div class="tots">
      <span>OB1 <b class="mono">${fmt(totals.OB1)}</b></span>
      <span>OB2 <b class="mono">${fmt(totals.OB2)}</b></span>
      <span>Normal <b class="mono">${fmt(totals.NORMAL)}</b></span></div>
      <div class="obamt mono">${SEK.format(total)}</div></div>`;

  if(animate){
    requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'));
    countUp($('#v1'),totals.OB1,m=>fmt(Math.round(m)));
    countUp($('#v2'),totals.OB2,m=>fmt(Math.round(m)));
    countUp($('#vt'),total,v=>SEK.format(v));
  }
}

// edit + add/remove (delegated)
$('#tlcard').addEventListener('change',e=>{
  const inp=e.target.closest('.tin'); if(!inp)return;
  const i=+inp.dataset.i, k=+inp.dataset.k, d=new Date(inp.value);
  if(isNaN(d)) return;
  TL.list[i][k]=d; renderAll(false); syncJson();
});
$('#tlcard').addEventListener('click',e=>{
  if(e.target.id==='csvbtn'){ exportCSV(); return; }
  if(e.target.id==='addrow'){
    const last=TL.list[TL.list.length-1];
    const base=last?new Date(last[1]):new Date();
    TL.list.push([new Date(base),new Date(base.getTime()+3600000)]); renderAll(false); syncJson(); return;
  }
  const del=e.target.dataset.del;
  if(del!==undefined){ TL.list.splice(+del,1); renderAll(false); syncJson(); }
});
</script>
<script>(function(){function ic(){var t=document.documentElement.getAttribute('data-theme')||'light';var e=document.querySelector('.theme-icon');if(e)e.textContent=t==='dark'?'☀️':'🌙';}ic();var b=document.getElementById('theme-toggle');if(b)b.addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme')||'light';var n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('dt_theme',n);}catch(e){}ic();});})();</script>
</body>
